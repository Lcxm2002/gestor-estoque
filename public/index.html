<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestor de Estoque</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mut:#6b7686;--line:#dfe3e8;--acc:#1f5eff;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header h1{font-size:17px;margin:0 12px 0 0}
nav button{border:0;background:none;padding:8px 12px;border-radius:6px;font:inherit;cursor:pointer;color:var(--mut)}
nav button.on{background:var(--acc);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stats .card{margin:0}.stats b{display:block;font-size:26px}.stats span{color:var(--mut)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
input,select{padding:9px;border:1px solid var(--line);border-radius:6px;font:inherit;color:var(--ink);background:#fff;min-width:0}
button.p{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:10px 14px;font:inherit;cursor:pointer}
button.l{background:none;border:0;color:var(--acc);cursor:pointer;font:inherit;padding:2px 6px}
button.l.d{color:var(--bad)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:13px}
.empty{color:var(--mut);padding:12px 0}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;display:none}
#msg.err{background:var(--bad)}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Gestor de Estoque</h1>
  <nav>
    <button data-t="dash" class="on">Dashboard</button>
    <button data-t="emp">Empresas</button>
    <button data-t="prod">Produtos</button>
  </nav>
</header>
<main>
<section id="dash" class="on">
  <div class="stats">
    <div class="card"><b id="s-emp">–</b><span>Empresas</span></div>
    <div class="card"><b id="s-prod">–</b><span>Produtos</span></div>
    <div class="card"><b id="s-val">–</b><span>Valor em estoque</span></div>
  </div>
  <div class="card"><h3 style="margin-top:0">Empresas e itens</h3><div id="resumo"></div></div>
</section>

<section id="emp">
  <div class="card">
    <h3 style="margin-top:0">Cadastrar empresa</h3>
    <form id="f-emp">
      <label>Razão social<input name="razao_social" required></label>
      <label>CNPJ<input name="cnpj" required inputmode="numeric" placeholder="somente números" maxlength="18"></label>
      <label>Nome fantasia<input name="nome_fantasia" required></label>
      <label>Endereço<input name="endereco" required></label>
      <label>Estado (UF)<select name="uf" id="uf" required><option value="">Carregando…</option></select></label>
      <label>Município<select name="municipio" id="mun" required disabled><option value="">Selecione o estado</option></select></label>
      <button class="p">Salvar empresa</button>
    </form>
  </div>
  <div class="card tw"><table>
    <thead><tr><th>Razão social</th><th>Fantasia</th><th>CNPJ</th><th>Cidade/UF</th><th>Produtos</th></tr></thead>
    <tbody id="t-emp"></tbody></table></div>
</section>

<section id="prod">
  <div class="card">
    <h3 style="margin-top:0" id="f-title">Novo produto</h3>
    <form id="f-prod">
      <input type="hidden" name="id">
      <label>Empresa<select name="empresa_id" class="sel-emp" required></select></label>
      <label>Nome<input name="nome" required></label>
      <label>Código/SKU<input name="sku" required></label>
      <label>Preço unitário (R$)<input name="preco" type="number" step="0.01" min="0" required></label>
      <label>Quantidade<input name="quantidade" type="number" step="1" min="0" required></label>
      <div><button class="p">Salvar produto</button> <button type="button" class="l" id="cancel" hidden>Cancelar edição</button></div>
    </form>
  </div>
  <div class="card">
    <label style="max-width:300px;margin-bottom:12px">Filtrar por empresa
      <select id="filtro"><option value="">Todas</option></select></label>
    <div class="tw"><table>
      <thead><tr><th>Produto</th><th>SKU</th><th>Empresa</th><th>Preço</th><th>Qtd.</th><th></th></tr></thead>
      <tbody id="t-prod"></tbody></table></div>
  </div>
</section>
</main>
<div id="msg"></div>

<script>
const $ = s => document.querySelector(s);
const brl = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IBGE = 'https://servicodados.ibge.gov.br/api/v1/localidades';
let empresas = [];

function toast(t, err) {
  const m = $('#msg'); m.textContent = t; m.className = err ? 'err' : ''; m.style.display = 'block';
  setTimeout(() => m.style.display = 'none', 3000);
}
async function api(path, opts = {}) {
  const r = await fetch('/api/' + path, {headers:{'Content-Type':'application/json'}, ...opts});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.erro || 'Erro inesperado');
  return d;
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };

// Abas
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button,section').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); $('#' + b.dataset.t).classList.add('on');
  if (b.dataset.t === 'dash') loadDash();
});

// IBGE
const loadUFs = run(async () => {
  const ufs = await (await fetch(IBGE + '/estados?orderBy=nome')).json();
  $('#uf').innerHTML = '<option value="">Selecione</option>' +
    ufs.map(u => `<option value="${u.sigla}">${esc(u.nome)} (${u.sigla})</option>`).join('');
});
$('#uf').onchange = run(async e => {
  const mun = $('#mun'); mun.disabled = true;
  if (!e.target.value) { mun.innerHTML = '<option value="">Selecione o estado</option>'; return; }
  mun.innerHTML = '<option value="">Carregando…</option>';
  const list = await (await fetch(`${IBGE}/estados/${e.target.value}/municipios?orderBy=nome`)).json();
  mun.innerHTML = '<option value="">Selecione</option>' + list.map(m => `<option>${esc(m.nome)}</option>`).join('');
  mun.disabled = false;
});

// Empresas
const loadEmpresas = run(async () => {
  empresas = await api('empresas');
  $('#t-emp').innerHTML = empresas.length ? empresas.map(e => `<tr><td>${esc(e.razao_social)}</td>
    <td>${esc(e.nome_fantasia)}</td><td>${e.cnpj}</td><td>${esc(e.municipio)}/${e.uf}</td><td>${e.total_produtos}</td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">Nenhuma empresa cadastrada.</td></tr>';
  const opts = empresas.map(e => `<option value="${e.id}">${esc(e.nome_fantasia)}</option>`).join('');
  document.querySelectorAll('.sel-emp').forEach(s => s.innerHTML = '<option value="">Selecione</option>' + opts);
  $('#filtro').innerHTML = '<option value="">Todas</option>' + opts;
});
$('#f-emp').onsubmit = run(async e => {
  e.preventDefault();
  await api('empresas', {method:'POST', body: JSON.stringify(Object.fromEntries(new FormData(e.target)))});
  e.target.reset(); $('#mun').disabled = true; toast('Empresa salva.'); await loadEmpresas();
});

// Produtos
const loadProdutos = run(async () => {
  const f = $('#filtro').value;
  const list = await api('produtos' + (f ? '?empresa_id=' + f : ''));
  $('#t-prod').innerHTML = list.length ? list.map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.sku)}</td>
    <td>${esc(p.empresa)}</td><td>${brl(p.preco)}</td><td>${p.quantidade}</td>
    <td><button class="l" onclick="editar(${p.id})">Editar</button>
    <button class="l d" onclick="excluir(${p.id})">Excluir</button></td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">Nenhum produto encontrado.</td></tr>';
});
$('#filtro').onchange = loadProdutos;
function resetProd() {
  $('#f-prod').reset(); $('#f-prod [name=id]').value = '';
  $('#f-title').textContent = 'Novo produto'; $('#cancel').hidden = true;
}
$('#cancel').onclick = resetProd;
$('#f-prod').onsubmit = run(async e => {
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target));
  const id = d.id; delete d.id;
  await api('produtos' + (id ? '/' + id : ''), {method: id ? 'PUT' : 'POST', body: JSON.stringify(d)});
  resetProd(); toast('Produto salvo.'); await loadProdutos();
});
window.editar = run(async id => {
  const p = await api('produtos/' + id), f = $('#f-prod');
  for (const k of ['id','empresa_id','nome','sku','preco','quantidade']) f[k].value = p[k];
  $('#f-title').textContent = 'Editar produto'; $('#cancel').hidden = false; scrollTo(0, 0);
});
window.excluir = run(async id => {
  if (!confirm('Excluir este produto?')) return;
  await api('produtos/' + id, {method:'DELETE'}); toast('Produto excluído.'); await loadProdutos();
});

// Dashboard
const loadDash = run(async () => {
  const s = await api('dashboard/stats');
  $('#s-emp').textContent = s.total_empresas;
  $('#s-prod').textContent = s.total_produtos;
  $('#s-val').textContent = brl(s.valor_estoque);
  $('#resumo').innerHTML = s.empresas.length ? s.empresas.map(e => `<details><summary>${esc(e.nome_fantasia)}
    — ${esc(e.municipio)}/${e.uf} — ${e.produtos.length} itens — ${brl(e.valor_estoque)}</summary>
    ${e.produtos.length ? '<div class="tw"><table><tbody>' + e.produtos.map(p =>
      `<tr><td>${esc(p.nome)}</td><td>${esc(p.sku)}</td><td>${p.quantidade} un.</td><td>${brl(p.preco)}</td></tr>`).join('')
      + '</tbody></table></div>' : '<div class="empty">Sem produtos.</div>'}</details>`).join('')
    : '<div class="empty">Cadastre uma empresa para começar.</div>';
});

loadUFs(); loadEmpresas().then(() => { loadProdutos(); loadDash(); });
</script>
</body>
</html>
